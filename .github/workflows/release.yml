name: Release & Publish Extension

# Trigger:
#  - automatically when a git tag like v1.2.3 is pushed
#  - manually via "Run workflow" in the GitHub Actions tab
on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (e.g. 0.0.2). Leave empty to use package.json version."
                required: false
                type: string

permissions:
    contents: write # needed to create a GitHub Release

jobs:
    release:
        name: Build, Release & Publish
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Determine version
              id: version
              run: |
                  if [ -n "${{ github.event.inputs.version }}" ]; then
                    VERSION="${{ github.event.inputs.version }}"
                  elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                    VERSION="${GITHUB_REF#refs/tags/v}"
                  else
                    VERSION="$(node -p "require('./package.json').version")"
                  fi
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "Using version: ${VERSION}"

            - name: Sync package.json version
              run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

            - name: Compile extension
              run: npm run compile

            - name: Package VSIX
              run: npx --no-install vsce package --out "vscode-sap-tms-${{ steps.version.outputs.version }}.vsix"

            - name: Upload VSIX as build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: vscode-sap-tms-${{ steps.version.outputs.version }}
                  path: vscode-sap-tms-${{ steps.version.outputs.version }}.vsix

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.version.outputs.version }}
                  name: v${{ steps.version.outputs.version }}
                  generate_release_notes: true
                  files: vscode-sap-tms-${{ steps.version.outputs.version }}.vsix

            - name: Publish to VS Code Marketplace
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
              run: npx --no-install vsce publish --packagePath "vscode-sap-tms-${{ steps.version.outputs.version }}.vsix"
